{% extends "base.html" %}
{% block title %}Log in · Policy Tracker{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="primary">Log in</button>
  </form>
</section>
{% endblock %}
